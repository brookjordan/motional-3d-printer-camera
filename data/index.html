<!doctype html>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<noscript>
  <meta http-equiv="refresh" content="{{REFRESH_SECONDS}}">
</noscript>
<link rel="stylesheet" href="/app.css">

<div id="info-messages" style="color: blue; margin-bottom: 10px;"></div>
<div id="img-container" class="img-container">
  <canvas id="img-canvas" class="img-canvas"></canvas>
  <img id="img-loading" class="img-loading" src="/i/latest.jpg" alt="latest frame">
</div>
<div id="error-messages" style="color: red; margin-top: 10px;"></div>

<h1 id="heading" class="secrets-header">{{HEADING}}</h1>
<p id="help" class="muted">{{HELP}}</p>

<table id="diagnostics-table">
  <thead>
    <tr>
      <th>Key</th>
      <th>Value</th>
    </tr>
  </thead>
  <tbody>{{STATUS_ROWS}}</tbody>
</table>

<script type="module" src="/js/entry.js" async></script>
<script nomodule src="/js/bundle.js" async></script>
